name: ISKUR Sirnak Kontrol

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Paketleri kur
        run: pip install -r requirements.txt
      - name: Gorulmus ilanlari indir
        uses: actions/cache@v4
        with:
          path: gorulmus_ilanlar.json
          key: gorulmus-ilanlar-cache
          restore-keys: gorulmus-ilanlar-cache
      - name: Botu calistir
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
      - name: Gorulmus ilanlari kaydet
        uses: actions/cache/save@v4
        if: always()
        with:
          path: gorulmus_ilanlar.json
          key: gorulmus-ilanlar-cache-${{ github.run_id }}
