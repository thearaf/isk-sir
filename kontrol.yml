name: İŞKUR Şırnak Kontrol

on:
  schedule:
    - cron: '*/5 * * * *'  # Her 5 dakikada bir
  workflow_dispatch:  # Manuel çalıştırma

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Paketleri kur
        run: pip install -r requirements.txt

      - name: Görülmüş ilanları indir
        uses: actions/cache@v4
        with:
          path: gorulmus_ilanlar.json
          key: gorulmus-ilanlar-cache
          restore-keys: gorulmus-ilanlar-cache

      - name: Botu çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Görülmüş ilanları kaydet
        uses: actions/cache/save@v4
        if: always()
        with:
          path: gorulmus_ilanlar.json
          key: gorulmus-ilanlar-cache-${{ github.run_id }}
